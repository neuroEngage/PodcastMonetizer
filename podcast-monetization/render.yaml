services:
  - type: web
    name: podmonetize-backend
    env: python
    rootDir: podcast-monetization/backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn server:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false # User needs to enter this in Render dashboard
      - key: PYTHON_VERSION
        value: 3.10.0
